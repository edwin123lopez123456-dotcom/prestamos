name: Supabase keep-alive

# Evita que Supabase pause el proyecto Free por inactividad (~7 días sin uso).
# Configura los secrets SUPABASE_URL y SUPABASE_ANON_KEY en GitHub → Settings → Secrets.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lectura mínima)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan secrets: SUPABASE_URL y/o SUPABASE_ANON_KEY"
            exit 1
          fi

          curl -sf \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/clientes?select=id&limit=1"

          echo "OK — actividad registrada en Supabase"
